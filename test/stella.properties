[STELLA]
APP_NAME=aistack-cli-test
APP_WORK_ROOT=../workspace/aistack-cli-test
APP_CACHE_DIR=../cache/aistack-cli-test
APP_FEATURE_LIST=bats#2 yq#^4 jq#^1_8 miniforge3 llmfit

[AISTACK]
# add search path of runtimes and modules, only if they are installed, to a generic context file used when a tool is launched
GENERIC_CONTEXT_ADD_RUNTIME=nodejs
GENERIC_CONTEXT_ADD_MODULE=yq jq